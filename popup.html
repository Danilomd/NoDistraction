<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Focus</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="wrapper">
      <!-- MAIN SCREEN -->
      <div class="container" id="mainScreen">
        <button id="settingsBtn" class="settings-btn">⚙</button>
        <h1>NoDistraction</h1>
        <div class="section toggle">
          <span>Status:</span>
          <button id="toggleBtn" class="off">Desligado</button>
        </div>
        <div class="section">
          <div class="add-site">
            <input type="text" id="siteInput" placeholder="ex: youtube.com" />
            <button id="addBtn">+</button>
          </div>
        </div>
        <div class="section">
          <ul id="siteList"></ul>
        </div>
      </div>
      <!-- SETTINGS -->
      <div class="container hidden" id="settingsScreen">
        <button id="backBtn" class="back-btn">←</button>
        <h1>Configurações</h1>
        <div class="section theme-section">
          <span>Tema</span>
          <label class="switch">
            <input type="checkbox" id="themeToggle" />
            <span class="slider"></span>
          </label>
        </div>
      </div>
      <script src="popup.js"></script>
    </div>
  </body>
</html>
